[package]
name = "interfold-auction-input-binding"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "3"

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["std", "heap-embedded-alloc"] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
interfold-auction-bfv-slots = { path = "../../bfv-slots", features = ["openvm-hashes"] }
e3-safe = { git = "https://github.com/theinterfold/interfold", rev = "c65722fcab24b3b5ffc7ccaf4544bd1d6ef8826a", features = ["openvm"] }
sha2 = "=0.10.9"

[profile.release]
lto = "fat"
codegen-units = 1
