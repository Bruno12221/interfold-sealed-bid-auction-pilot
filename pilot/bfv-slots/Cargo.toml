[package]
name = "interfold-auction-bfv-slots"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[features]
openvm-hashes = ["e3-compute-provider/openvm-hashes"]

[dependencies]
# The exact fhe.rs revision used by Interfold 0.19.0 (upstream tag v0.4.2).
fhe = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.4.2", features = ["experimental-mbfv"] }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.4.2" }
rand = "0.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
prost = "=0.14.4"
sha3 = "0.10"
sha2 = "0.10"
e3-bfv-client = { git = "https://github.com/theinterfold/interfold", rev = "c65722fcab24b3b5ffc7ccaf4544bd1d6ef8826a" }
e3-compute-provider = { git = "https://github.com/theinterfold/interfold", rev = "c65722fcab24b3b5ffc7ccaf4544bd1d6ef8826a" }
e3-fhe-params = { git = "https://github.com/theinterfold/interfold", rev = "c65722fcab24b3b5ffc7ccaf4544bd1d6ef8826a", features = ["abi-encoding"] }
