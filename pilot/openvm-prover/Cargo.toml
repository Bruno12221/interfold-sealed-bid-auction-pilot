[package]
name = "interfold-openvm-prover"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[workspace]
resolver = "3"

[features]
cuda = ["openvm-sdk/cuda", "dep:openvm-cuda-common"]

[dependencies]
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", default-features = false, features = ["parallel", "evm-verify"] }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", default-features = false }
openvm-continuations = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2" }
openvm-stark-backend = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.1", default-features = false }
# The CUDA build's `probe` opens a device with it. The same revision the SDK's CUDA backend uses.
openvm-cuda-common = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.1", optional = true }
sha2 = "=0.10.9"
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "registry"] }
